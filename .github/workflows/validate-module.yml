name: 'Validate module'

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

on:
  push:
    branches:
      - main
    paths:
      - 'Evergreen/**'
      - 'tests/**'
      - '.rules/**'
      - '.github/workflows/validate-module.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'Evergreen/**'
      - 'tests/**'
      - '.rules/**'
      - '.github/workflows/validate-module.yml'
  workflow_dispatch:
    inputs:
      test_all_applications:
        description: 'Test all applications'
        type: boolean
        required: false
        default: false

jobs:
  pestertest5:
    name: "Run Pester tests on Windows PowerShell"
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Pester tests
        shell: powershell
        working-directory: "${{ github.workspace }}"
        env:
          EVERGREEN_TEST_ALL_APPLICATIONS: ${{ github.event_name == 'workflow_dispatch' && inputs.test_all_applications == true }}
        run: |
          .\tests\Install-Pester.ps1
          Import-Module -Name "Pester" -Force -ErrorAction "Stop"
          Import-Module -Name "$env:GITHUB_WORKSPACE\Evergreen" -Force
          Update-Evergreen -Verbose

          $Config = [PesterConfiguration]::Default
          $Config.Run.Path = "$env:GITHUB_WORKSPACE\tests"
          $Config.Run.PassThru = $true
          $Config.CodeCoverage.Enabled = $true
          $Config.CodeCoverage.Path = "$env:GITHUB_WORKSPACE\Evergreen"
          $Config.CodeCoverage.OutputFormat = "JaCoCo"
          $Config.CodeCoverage.OutputPath = "$env:GITHUB_WORKSPACE\CodeCoverage.xml"
          $Config.Output.Verbosity = "Detailed"
          $Config.TestResult.Enabled = $true
          $Config.TestResult.OutputFormat = "NUnitXml"
          $Config.TestResult.OutputPath = "$env:GITHUB_WORKSPACE\tests\TestResults.xml"
          Invoke-Pester -Configuration $Config

      # Upload test results
      - name: Upload Pester test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: "${{ github.workspace }}\\tests\\TestResults.xml"

      - name: Upload code coverage results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: codecov-results
          path: "${{ github.workspace }}\\CodeCoverage.xml"

  publish-test-results:
    name: "Publish Tests Results"
    needs: [ "pestertest5"]
    runs-on: ubuntu-latest
    if: always()
    permissions:
      checks: write

      # only needed unless run with comment_mode: off
      pull-requests: write

    steps:
      - name: Download Pester Test Result Artifacts
        uses: actions/download-artifact@v8
        with:
          name: test-results
          path: test-results

      - name: Publish Pester Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: "test-results/**/*.xml"
