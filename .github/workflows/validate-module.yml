name: 'Validate module'

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

on:
  push:
    branches:
      - main
    paths:
      - 'Evergreen/**'
      - 'tests/**'
      - '.rules/**'
      - '.github/workflows/validate-module.yml'
      - '.github/workflows/test-runtimes.yml'
      - '.github/workflows/update-module.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'Evergreen/**'
      - 'tests/**'
      - '.rules/**'
      - '.github/workflows/validate-module.yml'
      - '.github/workflows/test-runtimes.yml'
      - '.github/workflows/update-module.yml'
  workflow_dispatch:
    inputs:
      test_all_applications:
        description: 'Test all applications'
        type: boolean
        required: false
        default: false

jobs:
  runtime-matrix:
    uses: ./.github/workflows/test-runtimes.yml
    permissions:
      contents: read

  pestertest5:
    name: "Run live Pester tests on Windows PowerShell"
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Pester tests
        shell: powershell
        working-directory: "${{ github.workspace }}"
        env:
          EVERGREEN_TEST_ALL_APPLICATIONS: ${{ github.event_name == 'workflow_dispatch' && inputs.test_all_applications == true }}
        run: |
          .\tests\Invoke-Tests.ps1 -IncludeIntegration

      # Upload test results
      - name: Upload Pester test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-live-windows-powershell-5.1
          path: "${{ github.workspace }}/tests/Results/TestResults.xml"
          if-no-files-found: error

      - name: Upload code coverage results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: codecov-results-live-windows-powershell-5.1
          path: "${{ github.workspace }}/tests/Results/CodeCoverage.xml"
          if-no-files-found: error

  publish-test-results:
    name: "Publish Tests Results"
    needs: [ "runtime-matrix", "pestertest5"]
    runs-on: ubuntu-latest
    if: always()
    permissions:
      checks: write

      # only needed unless run with comment_mode: off
      pull-requests: write

    steps:
      - name: Download Pester Test Result Artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: test-results-*
          path: test-results

      - name: Publish Pester Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: "test-results/**/*.xml"
