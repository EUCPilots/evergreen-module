name: 'Update and publish module'

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-module:
    name: Update module version
    runs-on: windows-latest
    outputs:
      changes_detected: ${{ steps.commit.outputs.changes_detected }}
      new_version: ${{ steps.update-version.outputs.newversion }}
    steps:
      - uses: actions/checkout@v7
        id: checkout
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install and cache PowerShell modules
        id: psmodulecache
        uses: potatoqualitee/psmodulecache@v6.3
        with:
          modules-to-cache: MarkdownPS
          shell: powershell

      # Update the version number in the module manifest
      - name: Update module version number
        id: update-version
        shell: powershell
        run: |
            $ModulePath = "${{ github.workspace }}\Evergreen"
            $ManifestPath = "${{ github.workspace }}\Evergreen\Evergreen.psd1"

            # Importing the manifest to determine the version
            $Manifest = Test-ModuleManifest -Path $ManifestPath
            Write-Host "Old version is: $($Manifest.Version)"
            [System.String]$NewVersion = New-Object -TypeName "System.Version" -ArgumentList ((Get-Date -Format "yyMM"), ($Manifest.Version.Minor + 3 ), 0)
            Write-Host "New version is: $NewVersion"

            # Update the manifest with the new version value and fix the weird string replace bug
            $functionList = ((Get-ChildItem -Path (Join-Path -Path $ModulePath -ChildPath "Public")).BaseName)
            Update-ModuleManifest -Path $ManifestPath -ModuleVersion $NewVersion -FunctionsToExport $functionList
            (Get-Content -Path $ManifestPath) -replace 'PSGet_$module', $module | Set-Content -Path $ManifestPath
            (Get-Content -Path $ManifestPath) -replace 'NewManifest', $module | Set-Content -Path $ManifestPath
            (Get-Content -Path $ManifestPath) -replace 'FunctionsToExport = ','FunctionsToExport = @(' | Set-Content -Path $ManifestPath
            (Get-Content -Path $ManifestPath) -replace "$($functionList[-1])'", "$($functionList[-1])')" | Set-Content -Path $ManifestPath -Force
            echo "newversion=$NewVersion" >> $env:GITHUB_OUTPUT

      # Update the change log with the new version number
      - name: Update CHANGELOG.md
        id: update-changelog
        shell: powershell
        run: |
            $changeLog = "${{ github.workspace }}\changelog.md"
            $replaceString = "^## VERSION$"
            $content = Get-Content -Path $changeLog
            if ($content -match $replaceString) {
                $content -replace $replaceString, "## ${{steps.update-version.outputs.newversion}}" | Set-Content -Path $changeLog
            }
            else {
                Write-Host "No match in $changeLog for '## VERSION'. Manual update of CHANGELOG required." -ForegroundColor Cyan
            }

      # Update the list of supported apps in APPS.md
      - name: Update APPS.md
        id: update-apps
        shell: powershell
        run: |
            Import-Module -Name "$env:GITHUB_WORKSPACE\Evergreen" -Force
            Update-Evergreen
            Import-Module -Name MarkdownPS

            $OutFile = [System.IO.Path]::Combine($env:GITHUB_WORKSPACE, "apps.md")
            $markdown = New-MDHeader -Text "$((Find-EvergreenApp).Count) Supported applications" -Level 1
            $markdown += "`n"
            $line = "Evergreen supports the following applications:"
            $markdown += $line
            $markdown += "`n`n"
            $markdown += Find-EvergreenApp | New-MDTable
            $markdown | Out-File -FilePath $OutFile -NoNewline -Force -Encoding "Utf8"

      # Import GPG key so that we can sign the commit
      - name: Import GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPGKEY }}
          passphrase: ${{ secrets.GPGPASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true
          git_config_global: true
          git_tag_gpgsign: true
          git_push_gpgsign: false
          git_committer_name: ${{ secrets.COMMIT_NAME }}
          git_committer_email: ${{ secrets.COMMIT_EMAIL }}

      - name: Commit changes
        id: commit
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "Update module ${{steps.update-version.outputs.newversion}}"
          commit_user_name: ${{ secrets.COMMIT_NAME }}
          commit_user_email: ${{ secrets.COMMIT_EMAIL }}

      - name: "Changes have been detected"
        if: steps.commit.outputs.changes_detected == 'true'
        run: echo "Changes committed."

      - name: "No changes have been detected"
        if: steps.commit.outputs.changes_detected == 'false'
        run: echo "No changes detected."

      - name: Create and Push Tag
        id: create-tag
        if: steps.commit.outputs.changes_detected == 'true'
        shell: pwsh
        run: |
          $Module = Test-ModuleManifest -Path "$env:GITHUB_WORKSPACE\Evergreen\Evergreen.psd1"
          if ($null -ne $Module) {
              $tagName = "v$($Module.Version.ToString())"
              Write-Host "Creating tag: $tagName"
              
              # Create annotated tag (no GPG signature needed)
              git tag -a $tagName -m "Release version $($Module.Version.ToString())"
              
              # Push the tag with verbose output
              git push origin $tagName --verbose
              
              if ($LASTEXITCODE -eq 0) {
                  Write-Host "Tag $tagName created and pushed successfully" -ForegroundColor Green
              }
              else {
                  Write-Host "Failed to push tag. Exit code: $LASTEXITCODE" -ForegroundColor Red
                  exit $LASTEXITCODE
              }
          }
          else {
              Write-Host "Failed to read module manifest" -ForegroundColor Red
              exit 1
          }

      - name: Summarize update job
        if: always()
        shell: pwsh
        env:
          JOB_STATUS: ${{ job.status }}
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          CACHE_OUTCOME: ${{ steps.psmodulecache.outcome }}
          VERSION_OUTCOME: ${{ steps.update-version.outcome }}
          CHANGELOG_OUTCOME: ${{ steps.update-changelog.outcome }}
          APPS_OUTCOME: ${{ steps.update-apps.outcome }}
          GPG_OUTCOME: ${{ steps.import_gpg.outcome }}
          COMMIT_OUTCOME: ${{ steps.commit.outcome }}
          TAG_OUTCOME: ${{ steps.create-tag.outcome }}
          CHANGES_DETECTED: ${{ steps.commit.outputs.changes_detected }}
          NEW_VERSION: ${{ steps.update-version.outputs.newversion }}
        run: |
          function Get-StatusIcon {
              param([string]$Outcome)
              switch ($Outcome) {
                  "success" { return "✅" }
                  "failure" { return "❌" }
                  "cancelled" { return "⚪" }
                  "skipped" { return "⏭️" }
                  default { return "❔" }
              }
          }

          $overallIcon = if ($env:JOB_STATUS -eq "success") { "✅" } elseif ($env:JOB_STATUS -eq "failure") { "❌" } else { "⚪" }
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "## Update module job summary"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ""
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "Overall status: $overallIcon $($env:JOB_STATUS)"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "New version: $($env:NEW_VERSION)"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "Changes detected: $($env:CHANGES_DETECTED)"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ""
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "### Step outcomes"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- $(Get-StatusIcon $env:CHECKOUT_OUTCOME) Checkout: $($env:CHECKOUT_OUTCOME)"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- $(Get-StatusIcon $env:CACHE_OUTCOME) Install/cache modules: $($env:CACHE_OUTCOME)"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- $(Get-StatusIcon $env:VERSION_OUTCOME) Update module version: $($env:VERSION_OUTCOME)"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- $(Get-StatusIcon $env:CHANGELOG_OUTCOME) Update CHANGELOG.md: $($env:CHANGELOG_OUTCOME)"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- $(Get-StatusIcon $env:APPS_OUTCOME) Update apps.md: $($env:APPS_OUTCOME)"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- $(Get-StatusIcon $env:GPG_OUTCOME) Import GPG key: $($env:GPG_OUTCOME)"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- $(Get-StatusIcon $env:COMMIT_OUTCOME) Commit changes: $($env:COMMIT_OUTCOME)"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- $(Get-StatusIcon $env:TAG_OUTCOME) Create and push tag: $($env:TAG_OUTCOME)"

  publish-module:
    name: Publish module
    runs-on: ubuntu-latest
    needs: update-module
    steps:
      - uses: actions/checkout@v7
        id: checkout
        with:
          ref: refs/tags/v${{ needs.update-module.outputs.new_version }}
        if: needs.update-module.outputs.changes_detected == 'true'

      - name: Install and cache PowerShell modules
        id: psmodulecache
        uses: potatoqualitee/psmodulecache@v6.3
        if: needs.update-module.outputs.changes_detected == 'true'
        with:
          modules-to-cache: PowerShellGet
          shell: pwsh

      # Push the updated module to the PowerShell Gallery
      - name: Push module to PowerShell Gallery
        id: publish
        shell: pwsh
        if: needs.update-module.outputs.changes_detected == 'true'
        run: |
          $params = @{
              Path        = "${{ github.workspace }}/Evergreen"
              NuGetApiKey = "${{ secrets.NUGETAPIKEY }}"
              ErrorAction = "Stop"
          }
          Publish-Module @params

      - name: Summarize publish job
        if: always()
        shell: pwsh
        env:
          JOB_STATUS: ${{ job.status }}
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          CACHE_OUTCOME: ${{ steps.psmodulecache.outcome }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
          CHANGES_DETECTED: ${{ needs.update-module.outputs.changes_detected }}
          NEW_VERSION: ${{ needs.update-module.outputs.new_version }}
        run: |
          function Get-StatusIcon {
              param([string]$Outcome)
              switch ($Outcome) {
                  "success" { return "✅" }
                  "failure" { return "❌" }
                  "cancelled" { return "⚪" }
                  "skipped" { return "⏭️" }
                  default { return "❔" }
              }
          }

          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "## Publish module job summary"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ""
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "Changes detected in update job: $($env:CHANGES_DETECTED)"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "Target version: $($env:NEW_VERSION)"

          if ($env:CHANGES_DETECTED -ne "true") {
              Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "Overall status: ⏭️ skipped"
              Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "Publish steps were skipped because no changes were committed in the update job."
              exit 0
          }

          $overallIcon = if ($env:JOB_STATUS -eq "success") { "✅" } elseif ($env:JOB_STATUS -eq "failure") { "❌" } else { "⚪" }
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "Overall status: $overallIcon $($env:JOB_STATUS)"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ""
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "### Step outcomes"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- $(Get-StatusIcon $env:CHECKOUT_OUTCOME) Checkout release tag: $($env:CHECKOUT_OUTCOME)"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- $(Get-StatusIcon $env:CACHE_OUTCOME) Install/cache modules: $($env:CACHE_OUTCOME)"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- $(Get-StatusIcon $env:PUBLISH_OUTCOME) Publish to PowerShell Gallery: $($env:PUBLISH_OUTCOME)"
