name: 'Update and publish module'

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: evergreen-gallery-release
  cancel-in-progress: false

jobs:
  update-module:
    name: Update module version
    runs-on: windows-latest
    outputs:
      changes_detected: ${{ steps.commit.outputs.changes_detected }}
      new_version: ${{ steps.update-version.outputs.newversion }}
      previous_version: ${{ steps.update-version.outputs.previousversion }}
      tested_commit: ${{ steps.create-tag.outputs.tested_commit }}
    steps:
      - uses: actions/checkout@v7
        id: checkout
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install pinned release tools
        id: psmodulecache
        shell: powershell
        run: |
          $Tools = Import-PowerShellDataFile .\ci\ValidationTools.psd1
          [System.Net.ServicePointManager]::SecurityProtocol = [System.Net.ServicePointManager]::SecurityProtocol -bor 3072
          Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.208 -Force -Scope CurrentUser -ErrorAction Stop | Out-Null
          Install-Module -Name PowerShellGet -RequiredVersion $Tools.PowerShellGet -Repository PSGallery -Scope CurrentUser -Force -ErrorAction Stop
          Install-Module -Name MarkdownPS -RequiredVersion $Tools.MarkdownPS -Repository PSGallery -Scope CurrentUser -Force -ErrorAction Stop

      # Update the version number in the module manifest
      - name: Update module version number
        id: update-version
        shell: powershell
        run: |
            $ModulePath = "${{ github.workspace }}\Evergreen"
            $ManifestPath = "${{ github.workspace }}\Evergreen\Evergreen.psd1"
            $Tools = Import-PowerShellDataFile .\ci\ValidationTools.psd1
            Import-Module -Name PowerShellGet -RequiredVersion $Tools.PowerShellGet -Force -ErrorAction Stop

            # Importing the manifest to determine the version
            $Manifest = Test-ModuleManifest -Path $ManifestPath -ErrorAction Stop
            . .\ci\Get-ReleaseVersionData.ps1
            $Changelog = Get-Content -LiteralPath .\CHANGELOG.md -Raw -ErrorAction Stop
            $Release = Get-ReleaseVersionData -Version $Manifest.Version -Changelog $Changelog
            echo "previousversion=$($Release.PreviousVersion)" >> $env:GITHUB_OUTPUT
            Write-Host "Old version is: $($Manifest.Version)"
            [System.String]$NewVersion = $Release.Version.ToString()
            Write-Host "New version is: $NewVersion"

            $functionList = (Get-ChildItem -Path (Join-Path $ModulePath "Public") -Filter *.ps1).BaseName
            Update-ModuleManifest -Path $ManifestPath -ModuleVersion $NewVersion -FunctionsToExport $functionList -ReleaseNotes "$NewVersion`n$($Release.Notes)" -ErrorAction Stop
            Test-ModuleManifest -Path $ManifestPath -ErrorAction Stop | Out-Null
            $Release.Changelog | Set-Content -LiteralPath .\CHANGELOG.md -ErrorAction Stop
            echo "newversion=$NewVersion" >> $env:GITHUB_OUTPUT

      # Update the list of supported apps in APPS.md
      - name: Update APPS.md
        id: update-apps
        shell: powershell
        run: |
            Import-Module -Name "$env:GITHUB_WORKSPACE\Evergreen" -Force
            Update-Evergreen
            $Tools = Import-PowerShellDataFile .\ci\ValidationTools.psd1
            Import-Module -Name MarkdownPS -RequiredVersion $Tools.MarkdownPS -ErrorAction Stop

            $OutFile = [System.IO.Path]::Combine($env:GITHUB_WORKSPACE, "apps.md")
            $markdown = New-MDHeader -Text "$((Find-EvergreenApp).Count) Supported applications" -Level 1
            $markdown += "`n"
            $line = "Evergreen supports the following applications:"
            $markdown += $line
            $markdown += "`n`n"
            $markdown += Find-EvergreenApp | New-MDTable
            $markdown | Out-File -FilePath $OutFile -NoNewline -Force -Encoding "Utf8"

      # Import GPG key so that we can sign the commit
      - name: Import GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPGKEY }}
          passphrase: ${{ secrets.GPGPASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true
          git_config_global: true
          git_tag_gpgsign: true
          git_push_gpgsign: false
          git_committer_name: ${{ secrets.COMMIT_NAME }}
          git_committer_email: ${{ secrets.COMMIT_EMAIL }}

      - name: Commit changes
        id: commit
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "Update module ${{steps.update-version.outputs.newversion}}"
          commit_user_name: ${{ secrets.COMMIT_NAME }}
          commit_user_email: ${{ secrets.COMMIT_EMAIL }}

      - name: "Changes have been detected"
        if: steps.commit.outputs.changes_detected == 'true'
        run: echo "Changes committed."

      - name: "No changes have been detected"
        if: steps.commit.outputs.changes_detected == 'false'
        run: echo "No changes detected."

      - name: Create and Push Tag
        id: create-tag
        if: steps.commit.outputs.changes_detected == 'true'
        shell: pwsh
        run: |
          $Module = Test-ModuleManifest -Path "$env:GITHUB_WORKSPACE\Evergreen\Evergreen.psd1" -ErrorAction Stop
          if ($null -ne $Module) {
              $tagName = "v$($Module.Version.ToString())"
              Write-Host "Creating tag: $tagName"
              
              # Create annotated tag (no GPG signature needed)
              git tag -a $tagName -m "Release version $($Module.Version.ToString())"
              if ($LASTEXITCODE -ne 0) { throw "Failed to create release tag." }
              
              # Push the tag with verbose output
              git push origin $tagName --verbose
              
              if ($LASTEXITCODE -eq 0) {
                  Write-Host "Tag $tagName created and pushed successfully" -ForegroundColor Green
                  $Commit = git rev-parse HEAD
                  if ($LASTEXITCODE -ne 0) { throw "Cannot resolve release commit." }
                  "tested_commit=$Commit" >> $env:GITHUB_OUTPUT
              }
              else {
                  Write-Host "Failed to push tag. Exit code: $LASTEXITCODE" -ForegroundColor Red
                  exit $LASTEXITCODE
              }
          }
          else {
              Write-Host "Failed to read module manifest" -ForegroundColor Red
              exit 1
          }

      - name: Summarize update job
        if: always()
        shell: pwsh
        env:
          JOB_STATUS: ${{ job.status }}
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          CACHE_OUTCOME: ${{ steps.psmodulecache.outcome }}
          VERSION_OUTCOME: ${{ steps.update-version.outcome }}
          APPS_OUTCOME: ${{ steps.update-apps.outcome }}
          GPG_OUTCOME: ${{ steps.import_gpg.outcome }}
          COMMIT_OUTCOME: ${{ steps.commit.outcome }}
          TAG_OUTCOME: ${{ steps.create-tag.outcome }}
          CHANGES_DETECTED: ${{ steps.commit.outputs.changes_detected }}
          NEW_VERSION: ${{ steps.update-version.outputs.newversion }}
        run: |
          function Get-StatusIcon {
              param([string]$Outcome)
              switch ($Outcome) {
                  "success" { return "✅" }
                  "failure" { return "❌" }
                  "cancelled" { return "⚪" }
                  "skipped" { return "⏭️" }
                  default { return "❔" }
              }
          }

          $overallIcon = if ($env:JOB_STATUS -eq "success") { "✅" } elseif ($env:JOB_STATUS -eq "failure") { "❌" } else { "⚪" }
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "## Update module job summary"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ""
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "Overall status: $overallIcon $($env:JOB_STATUS)"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "New version: $($env:NEW_VERSION)"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "Changes detected: $($env:CHANGES_DETECTED)"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ""
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "### Step outcomes"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- $(Get-StatusIcon $env:CHECKOUT_OUTCOME) Checkout: $($env:CHECKOUT_OUTCOME)"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- $(Get-StatusIcon $env:CACHE_OUTCOME) Install/cache modules: $($env:CACHE_OUTCOME)"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- $(Get-StatusIcon $env:VERSION_OUTCOME) Update module version and CHANGELOG.md: $($env:VERSION_OUTCOME)"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- $(Get-StatusIcon $env:APPS_OUTCOME) Update apps.md: $($env:APPS_OUTCOME)"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- $(Get-StatusIcon $env:GPG_OUTCOME) Import GPG key: $($env:GPG_OUTCOME)"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- $(Get-StatusIcon $env:COMMIT_OUTCOME) Commit changes: $($env:COMMIT_OUTCOME)"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- $(Get-StatusIcon $env:TAG_OUTCOME) Create and push tag: $($env:TAG_OUTCOME)"

  validate-runtimes:
    name: Validate release runtimes
    needs: update-module
    if: needs.update-module.outputs.changes_detected == 'true'
    uses: ./.github/workflows/test-runtimes.yml
    permissions:
      contents: read
    with:
      ref: ${{ needs.update-module.outputs.tested_commit }}

  validate-analysis:
    needs: update-module
    if: needs.update-module.outputs.changes_detected == 'true'
    uses: ./.github/workflows/psscriptanalyzer.yml
    permissions:
      contents: read
      security-events: write
      actions: read
    with:
      ref: ${{ needs.update-module.outputs.tested_commit }}

  validate-release-gates:
    needs: update-module
    if: needs.update-module.outputs.changes_detected == 'true'
    uses: ./.github/workflows/validate-release.yml
    permissions:
      contents: read
    with:
      ref: ${{ needs.update-module.outputs.tested_commit }}
      coverage_base_ref: ${{ needs.update-module.outputs.previous_version }}

  stage-package:
    name: Validate release metadata and stage package
    needs: [update-module, validate-runtimes, validate-analysis, validate-release-gates]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.update-module.outputs.tested_commit }}
          fetch-depth: 0
      - name: Stage and validate package
        shell: pwsh
        env:
          CANDIDATE_VERSION: ${{ needs.update-module.outputs.new_version }}
          TESTED_COMMIT: ${{ needs.update-module.outputs.tested_commit }}
        run: |
          $Tools = Import-PowerShellDataFile .\ci\ValidationTools.psd1
          Install-Module -Name PowerShellGet -RequiredVersion $Tools.PowerShellGet -Repository PSGallery -Scope CurrentUser -Force -ErrorAction Stop
          Import-Module -Name PowerShellGet -RequiredVersion $Tools.PowerShellGet -Force -ErrorAction Stop
          $StageRoot = Join-Path $env:RUNNER_TEMP "release-package"
          New-Item -Path $StageRoot -ItemType Directory -ErrorAction Stop | Out-Null
          Copy-Item -LiteralPath .\Evergreen -Destination $StageRoot -Recurse -ErrorAction Stop
          . .\ci\Test-Release.ps1
          Test-Release -Version $env:CANDIDATE_VERSION -Tag "v$env:CANDIDATE_VERSION" -TestedCommit $env:TESTED_COMMIT -PackagePath (Join-Path $StageRoot "Evergreen")
      - uses: actions/upload-artifact@v7
        with:
          name: release-package
          path: ${{ runner.temp }}/release-package/Evergreen
          if-no-files-found: error

  publish-module:
    name: Publish module
    runs-on: ubuntu-latest
    needs: [update-module, stage-package]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        id: checkout
        with:
          ref: ${{ needs.update-module.outputs.tested_commit }}
          fetch-depth: 0
        if: needs.update-module.outputs.changes_detected == 'true'

      - uses: actions/download-artifact@v8
        with:
          name: release-package
          path: ${{ runner.temp }}/release-package/Evergreen

      - name: Install pinned publishing tools
        id: psmodulecache
        if: needs.update-module.outputs.changes_detected == 'true'
        shell: pwsh
        run: |
          $Tools = Import-PowerShellDataFile .\ci\ValidationTools.psd1
          Install-Module -Name PowerShellGet -RequiredVersion $Tools.PowerShellGet -Repository PSGallery -Scope CurrentUser -Force -ErrorAction Stop

      # Push the updated module to the PowerShell Gallery
      - name: Push module to PowerShell Gallery
        id: publish
        shell: pwsh
        if: needs.update-module.outputs.changes_detected == 'true'
        env:
          CANDIDATE_VERSION: ${{ needs.update-module.outputs.new_version }}
          TESTED_COMMIT: ${{ needs.update-module.outputs.tested_commit }}
          NUGET_API_KEY: ${{ secrets.NUGETAPIKEY }}
        run: |
          $Tools = Import-PowerShellDataFile .\ci\ValidationTools.psd1
          Import-Module -Name PowerShellGet -RequiredVersion $Tools.PowerShellGet -Force -ErrorAction Stop
          $PackagePath = Join-Path $env:RUNNER_TEMP "release-package/Evergreen"
          . .\ci\Test-Release.ps1
          Test-Release -Version $env:CANDIDATE_VERSION -Tag "v$env:CANDIDATE_VERSION" -TestedCommit $env:TESTED_COMMIT -PackagePath $PackagePath
          $params = @{
              Path        = $PackagePath
              NuGetApiKey = $env:NUGET_API_KEY
              ErrorAction = "Stop"
          }
          Publish-Module @params

      - name: Summarize publish job
        if: always()
        shell: pwsh
        env:
          JOB_STATUS: ${{ job.status }}
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          CACHE_OUTCOME: ${{ steps.psmodulecache.outcome }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
          CHANGES_DETECTED: ${{ needs.update-module.outputs.changes_detected }}
          NEW_VERSION: ${{ needs.update-module.outputs.new_version }}
        run: |
          function Get-StatusIcon {
              param([string]$Outcome)
              switch ($Outcome) {
                  "success" { return "✅" }
                  "failure" { return "❌" }
                  "cancelled" { return "⚪" }
                  "skipped" { return "⏭️" }
                  default { return "❔" }
              }
          }

          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "## Publish module job summary"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ""
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "Changes detected in update job: $($env:CHANGES_DETECTED)"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "Target version: $($env:NEW_VERSION)"

          if ($env:CHANGES_DETECTED -ne "true") {
              Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "Overall status: ⏭️ skipped"
              Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "Publish steps were skipped because no changes were committed in the update job."
              exit 0
          }

          $overallIcon = if ($env:JOB_STATUS -eq "success") { "✅" } elseif ($env:JOB_STATUS -eq "failure") { "❌" } else { "⚪" }
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "Overall status: $overallIcon $($env:JOB_STATUS)"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ""
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "### Step outcomes"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- $(Get-StatusIcon $env:CHECKOUT_OUTCOME) Checkout release tag: $($env:CHECKOUT_OUTCOME)"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- $(Get-StatusIcon $env:CACHE_OUTCOME) Install/cache modules: $($env:CACHE_OUTCOME)"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- $(Get-StatusIcon $env:PUBLISH_OUTCOME) Publish to PowerShell Gallery: $($env:PUBLISH_OUTCOME)"
